services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fabric
      POSTGRES_PASSWORD: fabric
      POSTGRES_DB: fabric
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabric -d fabric"]
      interval: 2s
      timeout: 5s
      retries: 20

  fabric:
    build: .
    ports:
      - "18080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://fabric:fabric@db:5432/fabric?sslmode=disable
      ADMIN_PASSWORD: fabric-admin
    depends_on:
      db:
        condition: service_healthy
